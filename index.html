<!doctype html>

<title>LUDORA</title>
<script>
/* تم، زبان و تم رنگی: قبل از رسم صفحه تعیین می‌شود تا چشمک نزند */
(function(){
  var d=document.documentElement,t=null,lg=null,sk=null;
  try{t=localStorage.getItem('mench.theme');lg=localStorage.getItem('mench.lang');sk=localStorage.getItem('mench.skin');}catch(e){}
  if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
  d.setAttribute('data-theme',t);
  if(lg!=='en')lg='fa';
  d.lang=lg;d.dir=lg==='en'?'ltr':'rtl';
  d.setAttribute('data-skin',['classic','persia','ocean','forest','neon','vampire','gems','sakura','space'].indexOf(sk)>=0?sk:'classic');
})();
</script>

/* ----- نورپردازی و تم‌ها ----- */
:root{--lightc:#ffd98a;--lightop:.9;--glow:1;--frame:transparent;--frameBorder:0px;--frameC:transparent;--frameGlow:none;--sheen:rgba(255,255,255,.22)}
:root[data-theme="dark"]{--lightop:.5;--glow:1.6;--sheen:rgba(255,255,255,.08)}
html[data-skin=persia]{--lightc:#ffc857;--frame:rgba(255,235,190,.28);--frameBorder:3px;--frameC:#c99a3a;--frameGlow:0 0 18px rgba(217,162,43,.35)}
html[data-skin=ocean]{--lightc:#7fd8ff;--frame:rgba(200,240,255,.22);--frameBorder:2px;--frameC:rgba(40,140,190,.55);--frameGlow:0 0 30px rgba(27,127,181,.3)}

html[data-skin=space][data-theme=dark]{--lightc:#5fa8ff;--lightop:.5;--glow:1.8;--sheen:rgba(150,200,255,.12);--frame:rgba(79,209,255,.12);--frameC:#4fd1ff;--frameGlow:0 0 36px rgba(79,209,255,.45)}
html[data-skin=persia] body{background-image:repeating-linear-gradient(45deg,rgba(120,80,20,.05) 0 2px,transparent 2px 16px)}
html[data-skin=ocean] body{background-image:radial-gradient(rgba(20,110,150,.12) 1.2px,transparent 1.3px);background-size:18px 18px}
html[data-skin=forest] body{background-image:radial-gradient(rgba(60,90,30,.08) 1px,transparent 1.1px);background-size:22px 22px}
html[data-skin=neon] body{background-image:radial-gradient(ellipse at 50% 0%,rgba(120,80,255,.28),transparent 60%)}
html[data-skin=vampire] body{background-image:radial-gradient(ellipse at 50% 110%,rgba(140,0,25,.35),transparent 60%)}
body{transition:background-color .8s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--lightop);
  background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--lightc) 38%,transparent),transparent 62%),radial-gradient(ellipse at 50% 115%,rgba(0,0,0,.14),transparent 55%)}
.cell::before,.zone,.piece::before{transition:background-color .6s,border-color .6s,box-shadow .6s,opacity .2s}
#board{z-index:1}
#board::before{content:"";position:absolute;inset:-16px;border-radius:28px;z-index:-1;pointer-events:none;transition:all .6s;
  background:var(--frame);border:var(--frameBorder) solid var(--frameC);box-shadow:var(--frameGlow)}
#board::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,var(--sheen) 50%,transparent 62%);background-size:260% 100%;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%{background-position:120% 0}55%,100%{background-position:-60% 0}}
#motes{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.mote{position:absolute;border-radius:50%;display:none}
html[data-skin=forest] .mote{display:block;background:#e9f77a;box-shadow:0 0 8px #e9f77a;animation:firefly var(--d) ease-in-out var(--dl) infinite}
html[data-skin=ocean] .mote{display:block;background:transparent;border:1px solid rgba(255,255,255,.7);animation:bubble var(--d) linear var(--dl) infinite}
html[data-skin=persia] .mote{display:block;background:#f5d37a;box-shadow:0 0 6px #f5d37a;animation:dust var(--d) linear var(--dl) infinite}
html[data-skin=neon] .mote{display:block;background:#fff;box-shadow:0 0 8px #a78bff;animation:twinkle var(--d) ease-in-out var(--dl) infinite}
html[data-skin=sakura] .mote{display:block;background:#f7b6c8;box-shadow:0 0 6px #f7b6c8;animation:dust var(--d) linear var(--dl) infinite}
html[data-skin=space] .mote{display:block;background:#fff;box-shadow:0 0 6px #9fd8ff;animation:twinkle var(--d) ease-in-out var(--dl) infinite}
html[data-skin=gems] .mote{display:block;background:#9ad1ff;box-shadow:0 0 8px #9ad1ff;animation:twinkle var(--d) ease-in-out var(--dl) infinite}
html[data-skin=vampire] .mote{display:block;background:#ff3b4f;box-shadow:0 0 8px #ff1e3c;animation:ember var(--d) ease-in-out var(--dl) infinite}
@keyframes firefly{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}50%{transform:translate(30px,-45vh);opacity:.2}80%{opacity:.9}100%{transform:translate(-20px,-90vh);opacity:0}}
@keyframes bubble{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-110vh);opacity:0}}
@keyframes dust{0%{transform:translate(0,0);opacity:0}25%{opacity:.8}100%{transform:translate(60px,-110vh);opacity:0}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes ember{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}60%{opacity:.5}100%{transform:translate(-40px,-100vh);opacity:0}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0;
  background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--lightc) 70%,transparent),transparent 65%)}
#flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.4)}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)) 12px
          max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --pc:#999;--tint:#eee}
header{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 4px 2px}
#turn{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;min-width:0}
#turnText{white-space:nowrap}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 4px var(--tint);flex:none}
.hb{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;line-height:1;padding:0}
#status{width:100%;max-width:560px;height:26px;line-height:26px;text-align:center;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#stage{position:relative;flex:1 1 0;min-height:0;width:100%;max-width:560px}
#board{position:absolute;left:0;top:0;width:320px;height:320px}
/* ----- تاس سه‌بعدی ----- */
#dieBtn{position:absolute;left:0;top:0;width:68px;height:68px;padding:0;border:0;background:none;cursor:pointer;z-index:8;
  transition:left .8s cubic-bezier(.5,0,.2,1),top .8s cubic-bezier(.5,0,.2,1)}
#dieBtn:disabled{cursor:default}
.scene{width:68px;height:68px;perspective:420px}
.cube{position:relative;width:68px;height:68px;transform-style:preserve-3d}
.face{position:absolute;left:0;top:0;width:68px;height:68px;border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:8px;background:linear-gradient(145deg,#fffdf6,#e6dfcb);border:2px solid color-mix(in srgb,var(--pc) 70%,#000);box-shadow:inset 0 0 8px rgba(0,0,0,.12)}
.face.f1{transform:translateZ(34px)}
.face.f2{transform:rotateX(90deg) translateZ(34px)}
.face.f3{transform:rotateY(90deg) translateZ(34px)}
.face.f4{transform:rotateY(-90deg) translateZ(34px)}
.face.f5{transform:rotateX(-90deg) translateZ(34px)}
.face.f6{transform:rotateY(180deg) translateZ(34px)}
.dc{display:flex;align-items:center;justify-content:center}
.dc.pip::after{content:"";width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6a5242,#1d140d)}
#dieBtn.ready .scene{animation:dieFloat 1.6s ease-in-out infinite}
#dieBtn.ready .face{box-shadow:inset 0 0 8px rgba(0,0,0,.12),0 0 14px var(--pc)}
@keyframes dieFloat{50%{transform:translateY(-5px)}}
html[data-skin=persia] .face{background:linear-gradient(145deg,#fff8e1,#e8c774);border-color:#b8862b}
html[data-skin=persia] .dc.pip::after{background:radial-gradient(circle at 35% 35%,#f7d774,#8a5a12)}
html[data-skin=ocean] .face{background:linear-gradient(145deg,rgba(210,245,255,.9),rgba(90,170,215,.8));border-color:#1b7fb5}
html[data-skin=ocean] .dc.pip::after{background:radial-gradient(circle at 35% 35%,#2b6f94,#0b3d5c)}
html[data-skin=forest] .face{background:repeating-linear-gradient(90deg,#a87a45 0 6px,#8a5a2e 6px 9px);border-color:#5b3a1e}
html[data-skin=forest] .dc.pip::after{background:radial-gradient(circle at 35% 35%,#6fbf5b,#2f6b2a)}
html[data-skin=neon] .face{background:#15102a;border-color:#a78bff;box-shadow:inset 0 0 10px rgba(167,139,255,.5)}
html[data-skin=neon] .dc.pip::after{background:#ff4fd8;box-shadow:0 0 8px #ff4fd8}
html[data-skin=vampire] .face{background:linear-gradient(145deg,#fbf4e8,#e3d3bb);border-color:#5a1020}
html[data-skin=vampire] .dc.pip::after{background:radial-gradient(circle at 35% 35%,#e0243f,#6a0a18)}
html[data-skin=gems] .face{background:linear-gradient(145deg,#e6d8ff,#7b4fd6);border-color:#4a2a9a}
html[data-skin=gems] .dc.pip::after{background:radial-gradient(circle at 35% 35%,#ffffff,#b9a4ff)}
html[data-skin=sakura] .face{background:linear-gradient(145deg,#fff5f8,#f7c6d6);border-color:#e0527a}
html[data-skin=sakura] .dc.pip::after{background:radial-gradient(circle at 35% 35%,#f2829f,#b8385c)}
html[data-skin=space] .face{background:linear-gradient(145deg,#e8f0ff,#8fa3c7);border-color:#4fd1ff}
html[data-skin=space] .dc.pip::after{background:radial-gradient(circle at 35% 35%,#7ff2ff,#1a6fa8);box-shadow:0 0 6px #4fd1ff}
/* ----- خانه‌ها ----- */
.cell{position:absolute;width:calc(100% / 11);height:calc(100% / 11)}
.cell::before{content:"";position:absolute;inset:11%;border-radius:50%;background:var(--cell);border:2px solid var(--line)}
.cell.s0::before{background:var(--t0);border:3px solid var(--c0)}
.cell.s1::before{background:var(--t1);border:3px solid var(--c1)}
.cell.s2::before{background:var(--t2);border:3px solid var(--c2)}
.cell.s3::before{background:var(--t3);border:3px solid var(--c3)}
.cell.h0::before{background:var(--c0);opacity:.35;border-color:transparent}
.cell.h1::before{background:var(--c1);opacity:.35;border-color:transparent}
.cell.h2::before{background:var(--c2);opacity:.45;border-color:transparent}
.cell.h3::before{background:var(--c3);opacity:.35;border-color:transparent}
.cell.b::before{background:var(--bcell);border-color:transparent}
.cell.center::before{inset:14%;border:none;
  background:conic-gradient(from -45deg,var(--c1) 0 25%,var(--c2) 0 50%,var(--c3) 0 75%,var(--c0) 0)}
.zone{position:absolute;width:calc(400% / 11);height:calc(400% / 11);border-radius:22%;transform:scale(.96);transition:box-shadow .2s,opacity .2s}
.zone.z0{background:var(--t0)}.zone.z1{background:var(--t1)}.zone.z2{background:var(--t2)}.zone.z3{background:var(--t3)}
.zone.off{opacity:.3}
.zone.active.z0{box-shadow:0 0 0 3px var(--c0)}.zone.active.z1{box-shadow:0 0 0 3px var(--c1)}
.zone.active.z2{box-shadow:0 0 0 3px var(--c2)}.zone.active.z3{box-shadow:0 0 0 3px var(--c3)}
/* ----- مهره‌ها ----- */
.piece{position:absolute;width:calc(100% / 11);height:calc(100% / 11);transition:left .14s linear,top .14s linear;z-index:2}
.piece::before,.piece::after{display:none!important}
.piece .pg{position:absolute;left:3%;top:3%;width:94%;height:94%;overflow:visible;pointer-events:none}
html[data-gfx=high] .piece .pg{filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.piece.p0{--pc:var(--c0)}.piece.p1{--pc:var(--c1)}.piece.p2{--pc:var(--c2)}.piece.p3{--pc:var(--c3)}
.piece.hint{cursor:pointer;z-index:4}
.piece.hint .pg{animation:hop .65s ease-in-out infinite}
.piece.nope{animation:nope .35s}
@keyframes hop{50%{transform:translateY(-16%)}}
@keyframes nope{20%,60%{transform:translateX(-12%)}40%,80%{transform:translateX(12%)}}
.piece .pn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:800 11px/1 system-ui,sans-serif;color:#fff;
  text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none;z-index:1}
/* ----- خانه‌های ویژه ----- */
.sp{position:absolute;width:calc(100% / 11);height:calc(100% / 11);display:flex;align-items:center;justify-content:center;
  font-size:clamp(11px,2.4vmin,18px);pointer-events:none;z-index:1;animation:spPulse 2.2s ease-in-out infinite}
@keyframes spPulse{50%{transform:scale(1.15)}}
/* ----- پس‌زمینه و آیکون‌ها ----- */
#decor{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;overflow:hidden}
#decor svg{width:100%;height:100%;display:block}
:root[data-theme=dark] #decor{opacity:.38}
.ico{display:inline-block;width:18px;height:18px;vertical-align:middle;margin-inline-end:6px}
.ico svg{width:100%;height:100%;display:block}
.hico{width:72px;height:72px;margin:0 auto 10px}
.hico svg{width:100%;height:100%;display:block}
/* ----- پنجره‌ها ----- */
#overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:var(--ov);padding:18px;overflow:auto}
#overlay.show{display:flex}
#overlay.solid{background:var(--bg)}
.card{width:100%;max-width:380px;text-align:center;margin:auto}
.card h1{margin:0 0 4px;font-size:44px;letter-spacing:-1px}
.card .sub{margin:0 0 18px;color:var(--muted);font-size:15px}
#winCard h1,#exitCard h1{font-size:32px}
.set-row{margin:12px 0;text-align:start}
.set-row>span{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.opt button{flex:1 1 auto;padding:9px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;color:var(--ink)}
.opt button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}
#seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;margin-bottom:12px}
.seat{display:flex;align-items:center;gap:8px;padding:12px;border-radius:16px;border:1.5px solid var(--line);
  background:var(--card);cursor:pointer;text-align:start;color:var(--ink)}
.seat .dot{--pc:var(--c0)}
.seat b{font-weight:600}
.seat span{margin-inline-start:auto;font-size:13px;color:var(--muted)}
.seat.off{opacity:.5}
.btn{display:block;width:100%;padding:15px;border-radius:16px;border:0;font-size:17px;font-weight:600;cursor:pointer;margin-top:10px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
details{margin-top:18px;text-align:start;color:var(--muted);font-size:14px;line-height:1.9}
summary{cursor:pointer;text-align:center}
details ul{margin:8px 0 0;padding:0 18px}
.dev{font-size:12px;color:var(--muted);margin-top:4px}
.crown{font-size:64px;display:inline-block;animation:crownIn .8s ease-out,bob 1.2s ease-in-out .8s infinite}
@keyframes crownIn{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes bob{50%{transform:translateY(-10px)}}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.cf{position:absolute;top:-20px;width:9px;height:13px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* ----- صفحهٔ بارگذاری ----- */
#loader{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000;transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
.ld-ring{position:relative;width:110px;height:110px}
.ld-ring i{position:absolute;width:32px;height:32px;border-radius:50%;border:2px solid var(--pb);box-shadow:0 4px 12px rgba(0,0,0,.25),0 0 14px var(--c0);opacity:0}
.ld-ring i:nth-child(1){background:var(--c0);left:39px;top:0;--k:0}
.ld-ring i:nth-child(2){background:var(--c1);left:78px;top:39px;--k:1}
.ld-ring i:nth-child(3){background:var(--c2);left:39px;top:78px;--k:2}
.ld-ring i:nth-child(4){background:var(--c3);left:0;top:39px;--k:3}
#loader.rise .ld-ring i{animation:rise .95s cubic-bezier(.2,1.25,.4,1) forwards;animation-delay:calc(var(--k,0)*.12s)}
@keyframes rise{0%{opacity:0;transform:translateY(220px)}30%{opacity:1}100%{opacity:1;transform:translateY(0)}}
/* ----- پنجرهٔ برنده ----- */
#winCard{position:relative;overflow:hidden;padding-top:6px}
#winCard>*{position:relative;z-index:1}
.wc-rays{position:absolute!important;z-index:0!important;left:50%;top:86px;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;
  background:repeating-conic-gradient(color-mix(in srgb,var(--wc,var(--c2)) 22%,transparent) 0deg 9deg,transparent 9deg 24deg);
  -webkit-mask-image:radial-gradient(circle,#000 10%,transparent 60%);mask-image:radial-gradient(circle,#000 10%,transparent 60%);animation:lspin 18s linear infinite}
@keyframes lspin{to{transform:rotate(360deg)}}
.wbadge{width:132px;height:132px;margin:8px auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 50%),var(--wc,var(--c2));
  box-shadow:0 0 0 6px var(--card),0 0 0 9px var(--wc,var(--c2)),0 0 46px var(--wc,var(--c2));
  animation:pop .9s cubic-bezier(.2,1.6,.4,1) both,float 2.4s ease-in-out .9s infinite}
.wbadge span{font-size:66px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.wbadge.bye{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 50%),var(--c1)}
@keyframes pop{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
@keyframes float{50%{transform:translateY(-8px)}}
#winTitle{font-size:32px;color:transparent;background:linear-gradient(90deg,var(--c0),var(--c2),var(--c1),var(--c0));-webkit-background-clip:text;background-clip:text;background-size:250% auto;animation:shimmer 3s linear infinite}
.ld-title{font-size:40px;font-weight:700;letter-spacing:-1px;margin:0;color:transparent;
  background:linear-gradient(90deg,var(--c0),var(--c2),var(--c1),var(--c3),var(--c0));-webkit-background-clip:text;background-clip:text;background-size:250% auto;animation:shimmer 3s linear infinite}
@keyframes shimmer{to{background-position:250% center}}
.wstats{display:flex;gap:10px;margin:16px 0 6px}
.wstat{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 6px}
.wstat b{display:block;font-size:22px;color:var(--wc,var(--ink))}
.wstat span{font-size:12px;color:var(--muted)}
/* ----- toast و فلش ----- */
#toast{position:fixed;left:50%;top:40%;z-index:35;pointer-events:none;opacity:0;white-space:nowrap;padding:12px 20px;border-radius:18px;
  background:var(--card);border:2px solid var(--c2);color:var(--ink);font-weight:700;font-size:17px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{animation:toastIn 1.7s ease both}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-80%)}}
#winFx{position:fixed;left:0;top:0;z-index:36;pointer-events:none;transition:opacity .7s}
#winFx.out{opacity:0}
#fpsPill{position:fixed;left:8px;top:8px;z-index:45;pointer-events:none;font:600 12px/1.2 ui-monospace,Menlo,Consolas,monospace;
  padding:5px 9px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff}
/* ----- کیفیت گرافیک ----- */
html[data-gfx=low] body::before,html[data-gfx=low] #board::after,html[data-gfx=low] #board::before,html[data-gfx=low] #flash,html[data-gfx=low] #motes{display:none!important}
html[data-gfx=low] body{background-image:none!important;transition:none}
html[data-gfx=low] .piece::before{box-shadow:none}
html[data-gfx=low] #dieBtn.ready .face{box-shadow:inset 0 0 8px rgba(0,0,0,.12)}
html[data-gfx=low] .cell::before,html[data-gfx=low] .zone{transition:none}
html[data-gfx=low] .sp{animation:none}
html[data-gfx=medium] .mote:nth-child(n+13){display:none!important}
html[data-gfx=medium] #board::before{box-shadow:none}
html[data-gfx=medium] #board::after{animation:none;opacity:.6}
/* ----- شکل مهره‌ها در تم‌های گرافیکی ----- */
html[data-skin=sakura] .piece.p0{--ch:'🌸'}html[data-skin=sakura] .piece.p1{--ch:'💧'}
html[data-skin=sakura] .piece.p2{--ch:'⭐'}html[data-skin=sakura] .piece.p3{--ch:'🍃'}
html[data-skin=space] .piece.p0{--ch:'🚀'}html[data-skin=space] .piece.p1{--ch:'🛸'}
html[data-skin=space] .piece.p2{--ch:'🌕'}html[data-skin=space] .piece.p3{--ch:'👾'}
html[data-skin=ocean] .piece.p0{--ch:'🐠'}html[data-skin=ocean] .piece.p1{--ch:'🐙'}
html[data-skin=ocean] .piece.p2{--ch:'🦀'}html[data-skin=ocean] .piece.p3{--ch:'🐚'}
html[data-skin=forest] .piece.p0{--ch:'🦊'}html[data-skin=forest] .piece.p1{--ch:'🦉'}
html[data-skin=forest] .piece.p2{--ch:'🐞'}html[data-skin=forest] .piece.p3{--ch:'🐸'}
html[data-skin=vampire] .piece.p0{--ch:'🩸'}html[data-skin=vampire] .piece.p1{--ch:'🦇'}
html[data-skin=vampire] .piece.p2{--ch:'🕯️'}html[data-skin=vampire] .piece.p3{--ch:'🌙'}
.spark{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;pointer-events:none;z-index:9;animation:sparkFly .6s ease-out forwards}
@keyframes sparkFly{to{transform:translate(var(--dx),var(--dy));opacity:0}}
#board.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
.achlist{text-align:start;margin:12px 0}
.ach{padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);margin-bottom:6px;color:var(--muted);font-size:14px}
.ach.on{color:var(--ink);border-color:var(--c2)}
/* ----- پنجره‌ها، دکمه‌ها و پس‌زمینهٔ گرافیکی ----- */
#overlay{background:radial-gradient(ellipse at 50% -5%,color-mix(in srgb,var(--c2) 26%,transparent),transparent 58%),radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--c0) 18%,transparent),transparent 55%),var(--ov)}
#overlay.solid{background:radial-gradient(ellipse at 50% -5%,color-mix(in srgb,var(--c2) 26%,transparent),transparent 58%),var(--bg)}
.card{position:relative;background:linear-gradient(165deg,color-mix(in srgb,var(--card) 88%,#fff 12%),var(--card) 70%);
  border:1.5px solid var(--line);border-radius:30px;padding:26px 20px 22px;
  box-shadow:0 22px 50px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.45)}
.card::before{content:"";display:block;width:72px;height:6px;border-radius:6px;margin:0 auto 14px;
  background:linear-gradient(90deg,var(--c0),var(--c2),var(--c1),var(--c3))}
.card h1{font-weight:800}
.btn{border-radius:18px;transition:transform .15s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--c1),var(--c0));color:#fff;box-shadow:0 10px 22px rgba(0,0,0,.22)}
.btn.primary:disabled{background:var(--muted);box-shadow:none}
.btn.ghost{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.ib{box-shadow:0 4px 12px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.opt button{border-radius:14px}
.opt button.on{background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 30%,var(--card)),var(--card));border-color:var(--c1)}
.seat{border-radius:20px;box-shadow:0 6px 14px rgba(0,0,0,.08)}
.wbadge{box-shadow:0 0 0 6px var(--card),0 0 0 9px var(--wc,var(--c2)),0 0 46px var(--wc,var(--c2)),inset 0 -6px 12px rgba(0,0,0,.15)}
.wstat{border-radius:20px;box-shadow:0 4px 10px rgba(0,0,0,.06)}
.ach{border-radius:16px}
#decor{opacity:.92}
:root[data-theme=dark] #decor{opacity:.6}
#toast{border-radius:22px}
</style>

<script>
/* ---------- هستهٔ بازی (بدون DOM) ---------- */
const Core=(()=>{
  // مسیر مشترک ۴۰ خانه‌ای؛ اندیس ۰، ۱۰، ۲۰، ۳۰ خانه‌های شروع هستند
  const TRACK=[[0,4],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2],[4,1],[4,0],[5,0],
    [6,0],[6,1],[6,2],[6,3],[6,4],[7,4],[8,4],[9,4],[10,4],[10,5],
    [10,6],[9,6],[8,6],[7,6],[6,6],[6,7],[6,8],[6,9],[6,10],[5,10],
    [4,10],[4,9],[4,8],[4,7],[4,6],[3,6],[2,6],[1,6],[0,6],[0,5]];
  const HOME=[[[1,5],[2,5],[3,5],[4,5]],[[5,1],[5,2],[5,3],[5,4]],
    [[9,5],[8,5],[7,5],[6,5]],[[5,9],[5,8],[5,7],[5,6]]];
  const BASE=[[[1,1],[2,1],[1,2],[2,2]],[[8,1],[9,1],[8,2],[9,2]],
    [[8,8],[9,8],[8,9],[9,9]],[[1,8],[2,8],[1,9],[2,9]]];
  const CORNER=[[0,0],[7,0],[7,7],[0,7]];
  // steps: -1 = در خانه، 0..39 = روی مسیر (0 = خانهٔ شروع)، 40..43 = خانه‌های نهایی
  const newState=(seats,safe)=>({seats:seats.slice(),safe:!!safe,steps:[0,1,2,3].map(()=>[-1,-1,-1,-1])});
  const isStart=idx=>idx%10===0;
  function target(S,p,i,d){
    const st=S.steps[p],s=st[i];let t;
    if(s===-1){if(d!==6)return null;t=0;}
    else{t=s+d;if(t>43)return null;}
    if(t!==0)for(let j=0;j<4;j++)if(j!==i&&st[j]===t)return null;
    return t;
  }
  function legal(S,p,d){
    const list=[];
    for(let i=0;i<4;i++){const t=target(S,p,i,d);if(t!==null)list.push({i,t});}
    return list;
  }
  function captureAt(S,p,t){
    const out=[];if(t>39)return out;
    const idx=(p*10+t)%40;
    if(S.safe&&isStart(idx))return out;
    for(const q of S.seats){
      if(q===p)continue;
      S.steps[q].forEach((s,j)=>{
        if(s>=0&&s<=39&&(q*10+s)%40===idx){S.steps[q][j]=-1;out.push({q,j});}
      });
    }
    return out;
  }
  const hasWon=(S,p)=>S.steps[p].every(s=>s>=40);
  const nextSeat=(S,p)=>S.seats[(S.seats.indexOf(p)+1)%S.seats.length];
  function danger(S,p,idx){
    let n=0;
    for(const q of S.seats){
      if(q===p)continue;
      for(const s of S.steps[q]){
        if(s>=0&&s<=39){
          const dist=(idx-(q*10+s)%40+40)%40;
          if(dist>=1&&dist<=6)n++;
        }
      }
    }
    return n;
  }
  // خانه‌های ویژه: کلید = شمارهٔ خانه روی مسیر مشترک
  const SPECIAL={5:'gift',15:'gift',25:'gift',35:'gift',8:'jump',28:'jump',12:'trap',32:'trap'};
  function botPick(S,p,moves,level){
    if(level==='easy'&&Math.random()<0.45)return moves[Math.floor(Math.random()*moves.length)];
    const st=S.steps[p];let best=moves[0],bs=-1e9;
    for(const m of moves){
      const s=st[m.i];let sc=Math.random()*(level==='easy'?12:level==='hard'?3:7);
      if(m.t>=40)sc+=45+(m.t-39)*2;
      else{
        const idx=(p*10+m.t)%40;
        if(!(S.safe&&isStart(idx))){
          for(const q of S.seats){
            if(q===p)continue;
            for(const os of S.steps[q])if(os>=0&&os<=39&&(q*10+os)%40===idx)sc+=100+os;
          }
        }
        sc-=danger(S,p,idx)*18;
      }
      if(m.t<=39){const k=(p*10+m.t)%40,kind=SPECIAL[k];if(kind==='gift')sc+=10;if(kind==='jump')sc+=8;if(kind==='trap')sc-=8;}
      if(s===-1)sc+=55;
      else{
        if(s<=39)sc+=danger(S,p,(p*10+s)%40)*16;
        sc+=m.t*0.4;
      }
      if(sc>bs){bs=sc;best=m;}
    }
    return best;
  }
  return{SPECIAL,TRACK,HOME,BASE,CORNER,newState,target,legal,captureAt,hasWon,nextSeat,danger,botPick};
})();
</script>

function burst(p,t){
  const b=$('#board'),[x,y]=TRACK[(p*10+t)%40];
  b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  const cols=['#ff5d7a','#ffd34d','#4fd1ff','#7dff9e','#ffffff'];
  for(let k=0;k<14;k++){
    const s=el('i','spark');
    const a=Math.random()*Math.PI*2,d=30+Math.random()*60;
    s.style.left=(x*100/N)+'%';s.style.top=(y*100/N)+'%';
    s.style.setProperty('--dx',(Math.cos(a)*d).toFixed(0)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d).toFixed(0)+'px');
    s.style.background=cols[k%cols.length];
    b.appendChild(s);
    setTimeout(()=>s.remove(),700);
  }
}

  const cores=navigator.hardwareConcurrency||4,mem=navigator.deviceMemory||4;
  const mobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  let tier='high';
  if(mem<=3||(mobile&&cores<=4))tier='low';
  else if(mem<=5||cores<=6)tier='medium';
  return{tier,cores,mem,mobile};
})();

  try{const v=localStorage.getItem('mench.gfx');if(['low','medium','high'].includes(v))return v;}catch(e){}

})();
function applyGfxAttr(){document.documentElement.setAttribute('data-gfx',GFX);}
function setGfx(v){
  GFX=v;GFX_AUTO=false;
  try{localStorage.setItem('mench.gfx',v);}catch(e){}
  applyGfxAttr();
}
function setGfxAuto(v){GFX=v;applyGfxAttr();}
const FPS={n:0,t:performance.now(),val:60,hist:[],show:false};
function fpsLoop(now){
  FPS.n++;
  if(now-FPS.t>=1000){
    FPS.val=Math.round(FPS.n*1000/(now-FPS.t));
    FPS.n=0;FPS.t=now;
    FPS.hist.push(FPS.val);if(FPS.hist.length>3)FPS.hist.shift();
    if(GFX_AUTO&&FPS.hist.length===3&&FPS.hist.every(v=>v<42)&&GFX!=='low'){
      setGfxAuto(GFX==='high'?'medium':'low');FPS.hist=[];
    }
    updateFpsPill();
  }
  requestAnimationFrame(fpsLoop);
}
function updateFpsPill(){
  const p=$('#fpsPill');
  p.hidden=!FPS.show;
  if(!FPS.show)return;
  p.textContent='FPS '+FPS.val+' · '+T(GFX_KEY[GFX]);
  p.style.color=FPS.val>=55?'#7dff9e':FPS.val>=40?'#ffd34d':'#ff7a7a';
}

}
function clearSave(){try{localStorage.removeItem('mench.save');}catch(e){}}

function loadSave(){
  let o=null;
  try{o=JSON.parse(localStorage.getItem('mench.save'));}catch(e){}
  if(!o||!o.S||!Array.isArray(o.S.seats)||o.S.seats.length<2||!Array.isArray(o.modes)){clearSave();return newGame();}
  G.id++;G.paused=false;
  G.S=o.S;G.modes=o.modes;G.started=o.started||[false,false,false,false];
  G.moves=o.moves||0;G.acc=o.acc||0;G.t0=Date.now();G.caps=o.caps||0;
  G.movable=[];G.pending=0;G.die=0;G.bonus=!!o.bonus;
  G.turn=o.S.seats.includes(o.turn)?o.turn:o.S.seats[0];

  }else beginRoll(G.bonus);

const PENT=[293.66,329.63,392,440,493.88,587.33];
const AMB={g:null,nodes:[],timers:[],skin:null};
const AMB_VOL={vampire:.8,forest:.9,ocean:.9,persia:.7,neon:.6,classic:.6};
function noiseBuf(c,secs){
  const len=Math.floor(c.sampleRate*secs),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  return b;
}
function ambStop(){
  const c=AC;
  AMB.timers.forEach(t=>clearTimeout(t));AMB.timers=[];
  const g=AMB.g,nodes=AMB.nodes;
  AMB.g=null;AMB.nodes=[];AMB.skin=null;
  if(g&&c){
    const t=c.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value,t);
    g.gain.linearRampToValueAtTime(0,t+1.2);
    setTimeout(()=>{
      nodes.forEach(n=>{try{if(n.stop)n.stop();}catch(e){}try{n.disconnect();}catch(e){}});
      try{g.disconnect();}catch(e){}
    },1400);
  }
}
function every(g,min,max,fn){
  const tick=()=>{
    if(AMB.g!==g)return;
    fn();
    AMB.timers.push(setTimeout(tick,(min+Math.random()*(max-min))*1000));
  };
  AMB.timers.push(setTimeout(tick,(min+Math.random()*(max-min))*500));
}
function loopNoise(c,g,secs,type,freq,q,gain){
  const s=c.createBufferSource();s.buffer=noiseBuf(c,secs);s.loop=true;
  const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const v=c.createGain();v.gain.value=gain;
  s.connect(f).connect(v).connect(g);s.start();
  AMB.nodes.push(s,f,v);
  return{filt:f,gain:v};
}
function lfo(c,freq,amp,target){
  const o=c.createOscillator(),a=c.createGain();
  o.frequency.value=freq;a.gain.value=amp;
  o.connect(a).connect(target);o.start();
  AMB.nodes.push(o,a);
}
function blip(c,dest,t,f0,f1,dur,type,vol){
  const o=c.createOscillator(),e=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur*.5);
  e.gain.setValueAtTime(0.0001,t);
  e.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.02,dur*.2));
  e.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(e).connect(dest);o.start(t);o.stop(t+dur+.05);
}
function drone(c,g,f,v,type){
  const o=c.createOscillator(),e=c.createGain();
  o.type=type||'sine';o.frequency.value=f;e.gain.value=v;
  o.connect(e).connect(g);o.start();
  AMB.nodes.push(o,e);
}
const BUILD={
  vampire(c,g){
    const w=loopNoise(c,g,4,'bandpass',500,2,.18);
    lfo(c,.13,260,w.filt.frequency);
    lfo(c,.07,.08,w.gain.gain);
    drone(c,g,55,.06,'triangle');drone(c,g,55.6,.04,'triangle');
    every(g,.9,1.3,()=>{const t=c.currentTime+.02;blip(c,g,t,62,40,.22,'sine',.18);blip(c,g,t+.26,58,38,.26,'sine',.13);});
    every(g,9,16,()=>{const t=c.currentTime+.02;blip(c,g,t,440,380,.5,'sine',.05);blip(c,g,t+.7,420,360,.6,'sine',.05);});
    every(g,22,34,()=>{const t=c.currentTime+.02;[329.63,493.88,659.25].forEach((f,k)=>blip(c,g,t+k*.02,f,null,4,'sine',.02));});
  },
  forest(c,g){
    const w=loopNoise(c,g,4,'lowpass',450,.7,.3);
    lfo(c,.08,220,w.filt.frequency);
    lfo(c,.05,.12,w.gain.gain);
    every(g,1.2,4,()=>{
      const n=1+rnd(3),t0=c.currentTime+.02;
      for(let k=0;k<n;k++){
        const b=2400+Math.random()*1400,t=t0+k*.22+Math.random()*.05;
        blip(c,g,t,b,b*1.35,.07,'sine',.05);
        blip(c,g,t+.1,b*1.1,b*.9,.08,'sine',.04);
      }
    });
  },
  ocean(c,g){
    const w=loopNoise(c,g,4,'lowpass',800,.5,.3);
    lfo(c,.09,.25,w.gain.gain);
    lfo(c,.09,400,w.filt.frequency);
    every(g,7,16,()=>{const t=c.currentTime+.02;blip(c,g,t,1800,2600,.4,'sine',.03);blip(c,g,t+.35,2600,1500,.45,'sine',.03);});
  },
  persia(c,g){
    drone(c,g,73.42,.05);drone(c,g,110,.035);drone(c,g,146.83,.02);
    every(g,2.5,5,()=>{
      const f=PENT[rnd(PENT.length)],t=c.currentTime+.02;
      blip(c,g,t,f,null,1.8,'triangle',.08);
      blip(c,g,t,f*2,null,1.2,'sine',.02);
    });
  },
  neon(c,g){
    [220,220*1.006].forEach(f=>{
      const o=c.createOscillator(),e=c.createGain(),flt=c.createBiquadFilter();
      o.type='sawtooth';o.frequency.value=f;e.gain.value=.025;
      flt.type='lowpass';flt.frequency.value=700;flt.Q.value=3;
      o.connect(e).connect(flt).connect(g);o.start();
      AMB.nodes.push(o,e,flt);
      lfo(c,.05,400,flt.frequency);
    });
    every(g,.9,1.6,()=>{
      const base=[220,277.18,329.63,415.3,440][rnd(5)],t=c.currentTime+.02;
      blip(c,g,t,base*(rnd(2)?1:2),null,.5,'square',.03);
    });
  },
  classic(c,g){
    drone(c,g,261.63,.03);drone(c,g,329.63,.03);
    every(g,2.5,5,()=>{const t=c.currentTime+.02;blip(c,g,t,[1046.5,1318.5,1568][rnd(3)],null,2,'sine',.05);});
  },
  sakura(c,g){BUILD.classic(c,g);},
  gems(c,g){BUILD.classic(c,g);},
  space(c,g){BUILD.classic(c,g);}
};
function ambStart(skin){
  const c=ac();
  if(!c||!AMB_ON)return;
  if(AMB.skin===skin&&AMB.g)return;
  ambStop();
  const g=c.createGain();
  g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(AMB_VOL[skin]||.6,c.currentTime+2.5);
  g.connect(c.destination);
  AMB.g=g;AMB.skin=skin;
  (BUILD[skin]||BUILD.classic)(c,g);
}
const PAL={
  persia:{wave:'triangle',vol:.09,scale:PENT,cap:{type:'noise',f:280,d:.4,v:.25}},
  forest:{wave:'triangle',vol:.09,scale:[523.25,587.33,659.25,783.99,880,1046.5],cap:{type:'noise',f:900,d:.2,v:.3}},
  ocean:{wave:'sine',vol:.1,slide:true,scale:[392,440,523.25,587.33,659.25,784],cap:{type:'noise',f:3000,d:.4,v:.2}},
  neon:{wave:'square',vol:.05,scale:[220,261.63,329.63,392,440,523.25],cap:{type:'slide',f0:1200,f1:200}},
  vampire:{wave:'triangle',vol:.08,scale:[146.83,174.61,220,261.63,293.66,329.63],cap:{type:'noise',f:200,d:1.1,v:.4}},
  gems:{wave:'sine',vol:.08,scale:[1046.5,1318.5,1568,1760,2093,2637],cap:{type:'noise',f:6000,d:.25,v:.2}},
  sakura:{wave:'sine',vol:.09,scale:[587.33,659.25,740,880,987.77,1174.66],cap:{type:'noise',f:1500,d:.5,v:.12}},
  space:{wave:'sine',vol:.08,slide:true,scale:[330,415.3,494,659,830,988],cap:{type:'noise',f:800,d:.5,v:.35}},
  classic:{wave:'sine',vol:.08,scale:[523.25,659.25,783.99,1046.5,1318.5,1568],cap:{type:'slide',f0:500,f1:90}}
};
function fxNoise(c,d,v,freq){
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=noiseBuf(c,d);f.type='lowpass';f.frequency.value=freq;
  g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
  s.connect(f).connect(g).connect(c.destination);s.start();
}
function sfx(name){
  if(!FX_ON)return;
  const c=ac();if(!c)return;
  const P=PAL[curSkin()]||PAL.classic,S=P.scale,t=c.currentTime,d=c.destination;
  const tn=(f,dur,when,vol)=>blip(c,d,t+(when||0),f,null,dur,P.wave,vol||P.vol);
  switch(name){
    case'roll':for(let k=0;k<8;k++)tn(S[rnd(S.length)],.2,k*.06);break;
    case'step':P.slide?blip(c,d,t,S[1],S[3],.16,P.wave,P.vol):tn(S[2],.16);break;
    case'enter':tn(S[3],.3);tn(S[5],.25,.06);break;
    case'capture':
      if(P.cap.type==='noise')fxNoise(c,P.cap.d,P.cap.v,P.cap.f);
      else blip(c,d,t,P.cap.f0,P.cap.f1,.4,P.wave,P.vol);
      tn(S[0]/2,.35);break;
    case'turn':tn(S[1],.2);break;
    case'win':S.forEach((f,k)=>tn(f,.6,k*.11,P.vol*1.2));break;
  }
}
function playMapIntro(skin){
  if(!FX_ON)return;
  const c=ac();if(!c)return;
  const P=PAL[skin]||PAL.classic,S=P.scale,t=c.currentTime+.05,d=c.destination;
  S.slice(0,6).forEach((f,k)=>blip(c,d,t+k*.1,f,null,.8,P.wave,P.vol*1.2));
  blip(c,d,t+.7,S[0]/2,S[0]/4,1.4,P.wave,P.vol*1.5);
  if(P.cap.type==='noise')fxNoise(c,.6,P.cap.v*.5,P.cap.f);
}
// موسیقی لابی
const LOBBY={on:false,timer:null,next:0,step:0,g:null,nb:null};
const CHORDS=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function lobbyKick(c,d,t){
  const o=c.createOscillator(),g=c.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);
  g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
  o.connect(g).connect(d);o.start(t);o.stop(t+.32);
}
function lobbyHat(c,d,t,v){
  if(!LOBBY.nb)LOBBY.nb=noiseBuf(c,.1);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=LOBBY.nb;f.type='highpass';f.frequency.value=7000;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
  s.connect(f).connect(g).connect(d);s.start(t);s.stop(t+.06);
}
function lobbyBass(c,d,f,t){
  const o=c.createOscillator(),flt=c.createBiquadFilter(),g=c.createGain();
  o.type='sawtooth';o.frequency.value=f;flt.type='lowpass';flt.frequency.value=520;
  g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);
  o.connect(flt).connect(g).connect(d);o.start(t);o.stop(t+.24);
}
function lobbySchedule(s,t){
  const c=AC,d=LOBBY.g,bar=Math.floor(s/16)%4,i=s%16,ch=CHORDS[bar];
  if(i%4===0)lobbyKick(c,d,t);
  if(i%2===1)lobbyHat(c,d,t,i%4===3?.07:.04);
  if(i%2===0)lobbyBass(c,d,mtof(ch[0]-24+(i%8===4?7:0)),t);
  if(i%2===0)blip(c,d,t,mtof(ch[(i/2)%3]+12+(bar===2?12:0)),null,.2,'triangle',.07);
}
function lobbyTick(){
  const c=AC,step=60/124/4;
  while(LOBBY.next<c.currentTime+.12){lobbySchedule(LOBBY.step,LOBBY.next);LOBBY.next+=step;LOBBY.step++;}
}
function lobbyStart(){
  const c=ac();if(!c||!AMB_ON||LOBBY.on)return;
  LOBBY.on=true;
  LOBBY.g=c.createGain();
  LOBBY.g.gain.setValueAtTime(0,c.currentTime);LOBBY.g.gain.linearRampToValueAtTime(.55,c.currentTime+1.5);
  LOBBY.g.connect(c.destination);
  LOBBY.step=0;LOBBY.next=c.currentTime+.1;
  LOBBY.timer=setInterval(lobbyTick,25);
}
function lobbyStop(){
  if(!LOBBY.on)return;
  LOBBY.on=false;clearInterval(LOBBY.timer);
  const g=LOBBY.g,c=AC;LOBBY.g=null;
  if(g&&c){
    g.gain.cancelScheduledValues(c.currentTime);g.gain.setValueAtTime(g.gain.value,c.currentTime);
    g.gain.linearRampToValueAtTime(0,c.currentTime+.6);
    setTimeout(()=>{try{g.disconnect();}catch(e){}},800);
  }
}

const DIE={rx:0,ry:0,D:68};
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const SHOW={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]};
let BOARD={bx:0,by:0,B:320};
function buildDie(){
  const box=$('#dieBtn');
  box.innerHTML='<div class="scene"><div class="cube" id="cube"></div></div>';
  const cube=$('#cube');
  for(let v=1;v<=6;v++){
    const f=el('div','face f'+v);
    for(let c=0;c<9;c++)f.appendChild(el('i','dc'+(PIPS[v].includes(c)?' pip':'')));
    cube.appendChild(f);
  }
  setDieTransform(0,0);
}
function setDieTransform(x,y){
  DIE.rx=x;DIE.ry=y;
  $('#cube').style.transform='rotateX('+x+'deg) rotateY('+y+'deg)';
}
function tumble(v){
  return new Promise(res=>{
    const cube=$('#cube'),[tx,ty]=SHOW[v];
    const sx=DIE.rx,sy=DIE.ry;
    const ex=Math.floor(sx/360)*360+360*(3+rnd(2))+tx;
    const ey=Math.floor(sy/360)*360+360*(3+rnd(2))+ty;
    const dur=1100;
    const anim=cube.animate([
      {transform:`rotateX(${sx}deg) rotateY(${sy}deg)`},
      {transform:`rotateX(${ex}deg) rotateY(${ey}deg)`}
    ],{duration:dur,easing:'cubic-bezier(.15,.7,.2,1)'});
    $('#dieBtn').animate([
      {transform:'translateY(0)'},{transform:'translateY(-30px)'},{transform:'translateY(0)'}
    ],{duration:dur,easing:'ease-out'});
    anim.onfinish=()=>{setDieTransform(ex,ey);res();};
  });
}
function dieSpot(p){
  const {bx,by,B}=BOARD,D=DIE.D,g=18;
  if(p===0)return[bx+g,by-D-14];
  if(p===1)return[bx+B-D-g,by-D-14];
  if(p===2)return[bx+B-D-g,by+B+14];
  return[bx+g,by+B+14];
}
function placeDie(p){
  const [x,y]=dieSpot(p),b=$('#dieBtn');
  b.style.left=x+'px';b.style.top=y+'px';
}
function moveDie(p){
  return new Promise(res=>{placeDie(p);setTimeout(res,850);});
}
function fit(){
  const stg=$('#stage'),W=stg.clientWidth,H=stg.clientHeight;
  if(W<80||H<80)return;
  let B=Math.min(W-40,H-2*(DIE.D+26));
  B=Math.max(180,Math.min(Math.floor(B),560));
  const bx=Math.round((W-B)/2),by=Math.round((H-B)/2);
  BOARD={bx,by,B};
  const b=$('#board');
  b.style.left=bx+'px';b.style.top=by+'px';b.style.width=b.style.height=B+'px';
  placeDie(G.S?G.turn:0);
}

function starPts(n,Ro,Ri,cx,cy){
  const s=[];
  for(let i=0;i<n*2;i++){
    const r=i%2?Ri:Ro,a=Math.PI*i/n-Math.PI/2;
    s.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));
  }
  return s.join(' ');
}

// هر تم مهرهٔ گرافیکی اختصاصی خودش را دارد؛ بدون ایموجی و بدون حروف روی مهره
function renderPieceArt(){
  const f=ART[curSkin()]||ART.classic;
  document.querySelectorAll('.piece').forEach(e=>{
    e.innerHTML='<svg class="pg" viewBox="0 0 100 100" aria-hidden="true">'+f()+'</svg>';
  });
}
function buildPieces(){
  const b=$('#board');
  b.querySelectorAll('.piece').forEach(e=>e.remove());
  pieceEls=[[],[],[],[]];
  for(let p=0;p<4;p++){
    const on=G.S.seats.includes(p);
    b.querySelector('.zone.z'+p).classList.toggle('off',!on);
    b.querySelectorAll('.b'+p).forEach(c=>{c.style.visibility=on?'visible':'hidden';});
    if(!on)continue;
    for(let i=0;i<4;i++){
      const e=el('div','piece p'+p);e.dataset.p=p;e.dataset.i=i;
      b.appendChild(e);pieceEls[p][i]=e;
      place(p,i);
    }
  }
}

/* ---------- نمایش وضعیت ---------- */
function setStatus(t){$('#status').textContent=t;}
function setTurnUI(){
  const p=G.turn,app=$('#app');
  app.style.setProperty('--pc','var(--c'+p+')');
  app.style.setProperty('--tint','var(--t'+p+')');
  $('#turnText').textContent=T('turn',colorName(p))+(isBot(p)?T('bot'):'');
  document.querySelectorAll('.zone').forEach((z,q)=>z.classList.toggle('active',q===p));
  const ready=G.phase==='roll'&&!isBot(p);
  const wb=$('#dieBtn');
  wb.disabled=!ready;wb.classList.toggle('ready',ready);
}
function clearHints(){document.querySelectorAll('.piece.hint').forEach(e=>e.classList.remove('hint'));}
function showHints(){
  const p=G.turn,st=G.S.steps[p];
  const baseMove=G.movable.some(m=>st[m.i]===-1);
  G.movable.forEach(m=>pieceEls[p][m.i].classList.add('hint'));
  if(baseMove)st.forEach((s,i)=>{if(s===-1)pieceEls[p][i].classList.add('hint');});
}
function nope(e){
  e.classList.remove('nope');void e.offsetWidth;e.classList.add('nope');
  setTimeout(()=>e.classList.remove('nope'),400);
}

/* ---------- جریان بازی ---------- */
function newGame(){
  const seats=[0,1,2,3].filter(p=>cfg[p]!=='off');
  if(seats.length<2)return;
  G.id++;G.paused=false;
  G.modes=cfg.slice();
  G.S=Core.newState(seats,SAFE);
  G.moves=0;G.movable=[];G.phase='idle';G.started=[false,false,false,false];
  G.pending=0;G.bonus=false;G.acc=0;G.t0=Date.now();G.caps=0;
  buildPieces();renderPieceArt();
  G.turn=seats[rnd(seats.length)];
  hideOverlay();clearConfetti();playMapIntro(curSkin());
  beginRoll(false);
}
// شروع یک نوبت یا نوبت اضافه (بعد از ۶)
async function beginRoll(bonus){
  const id=G.id,p=G.turn;
  G.phase='roll';G.movable=[];G.pending=0;G.bonus=false;
  clearHints();setTurnUI();saveGame();
  if(isBot(p)){
    setStatus(T('botRolls'));
    await sleep(650);if(id!==G.id)return;
    roll();
  }else{
    setStatus(T(bonus?'rollAgain':'rollPrompt'));
  }
}
async function nextPlayer(){
  const id=G.id;
  G.turn=Core.nextSeat(G.S,G.turn);
  G.phase='travel';G.movable=[];G.pending=0;G.bonus=false;
  clearHints();setTurnUI();saveGame();
  setStatus(T('travel',colorName(G.turn)));sfx('turn');
  await moveDie(G.turn);if(id!==G.id)return;
  await sleep(120);if(id!==G.id)return;
  beginRoll(false);
}
// پایان نوبت: اگر ۶ آمده باشد همان بازیکن دوباره تاس می‌اندازد
function endTurn(bonus){
  G.pending=0;
  if(bonus){
    G.bonus=true;
    beginRoll(true);
    return;
  }
  nextPlayer();
}

async function roll(){
  if(G.phase!=='roll')return;
  const id=G.id,p=G.turn;
  G.phase='rolling';setTurnUI();clearHints();setStatus('');
  let v=1+rnd(6);
  if(!G.started[p]&&v===6)v=1+rnd(5);
  G.started[p]=true;
  G.pending=v;saveGame();          // تاس ذخیره می‌شود تا رفرش آن را عوض نکند
  sfx('roll');
  await tumble(v);if(id!==G.id)return;
  await resolveRoll(v,id);
}
// تاسِ آماده را اعمال می‌کند: حرکت‌های ممکن را پیدا و اجرا می‌کند
async function resolveRoll(v,id){
  const p=G.turn;
  G.die=v;G.phase='rolling';
  const moves=Core.legal(G.S,p,v);
  G.movable=moves;
  if(!moves.length){
    setStatus(T('noMove',num(v)));
    await sleep(1000);if(id!==G.id)return;
    endTurn(v===6);
    return;
  }
  setStatus(T('came',num(v)));
  if(isBot(p)){
    await sleep(450);if(id!==G.id)return;
    doMove(Core.botPick(G.S,p,moves,LEVEL));
    return;
  }
  if(moves.length===1){            // تنها یک حرکت ممکن است: خودکار انجام می‌شود
    await sleep(400);if(id!==G.id)return;
    doMove(moves[0]);
    return;
  }
  G.phase='move';setTurnUI();showHints();
  setStatus(T('pick',num(v)));
}

async function doMove(m){
  if(G.phase!=='rolling'&&G.phase!=='move')return;
  const id=G.id,p=G.turn,i=m.i,v=G.die;
  G.phase='anim';G.moves++;clearHints();setTurnUI();
  const e=pieceEls[p][i];e.style.zIndex=6;
  const st=G.S.steps[p];
  if(st[i]===-1){st[i]=0;sfx('enter');place(p,i);await sleep(280);if(id!==G.id)return;}
  else{
    for(let s=st[i]+1;s<=m.t;s++){st[i]=s;sfx('step');place(p,i);await sleep(150);if(id!==G.id)return;}
  }
  e.style.zIndex='';
  await afterLanding(p,i,id);if(id!==G.id)return;
  if(Core.hasWon(G.S,p)){win(p);return;}
  endTurn(v===6);
}

/* ---------- برخورد، خانه‌های ویژه و جایزه ---------- */
function checkCapture(p,i){
  const t=G.S.steps[p][i];
  if(t<0||t>39)return false;
  const caps=Core.captureAt(G.S,p,t);
  if(caps.length){
    caps.forEach(c=>place(c.q,c.j));sfx('capture');buzz();burst(p,t);
    showToast(T('captured'));
    if(G.modes[p]==='human'){
      G.caps+=caps.length;
      const s=loadStats();s.captures+=caps.length;saveStats(s);
    }
  }
  return caps.length>0;
}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}};
// جابه‌جایی مهره به اندازهٔ d خانه؛ عقب‌تر از شروع یعنی برگشت به خانه
async function shiftPiece(p,i,d,id){
  const st=G.S.steps[p],s=st[i];
  if(s<0)return;
  if(s+d<0){
    for(let x=s-1;x>=0;x--){st[i]=x;sfx('step');place(p,i);await sleep(120);if(id!==G.id)return;}
    st[i]=-1;place(p,i);await sleep(200);return;
  }
  const t=Math.min(43,s+d);
  if(t===s)return;
  if(t!==0&&st.some((v,j)=>j!==i&&v===t)){showToast(T('blocked'));await sleep(400);return;}
  const dir=t>s?1:-1;
  for(let x=s+dir;dir>0?x<=t:x>=t;x+=dir){
    st[i]=x;sfx('step');place(p,i);await sleep(150);if(id!==G.id)return;
  }
}
async function afterLanding(p,i,id){
  if(checkCapture(p,i)){await sleep(350);if(id!==G.id)return;}
  const t=G.S.steps[p][i];
  if(t<0||t>39)return;
  const kind=SPECIAL[(p*10+t)%40];
  if(!kind)return;
  if(kind==='jump'||kind==='trap'){
    showToast(T(kind+'Txt'));
    await sleep(500);if(id!==G.id)return;
    await shiftPiece(p,i,kind==='jump'?5:-5,id);if(id!==G.id)return;
    if(checkCapture(p,i)){await sleep(350);if(id!==G.id)return;}
    return;
  }
  // جایزهٔ تصادفی
  const hasBase=G.S.steps[p].indexOf(-1)>=0;
  const REWARDS=['fwd5','back5','fwd3','back3','enter','fwd2'];
  let r=REWARDS[rnd(REWARDS.length)];
  if(r==='enter'&&!hasBase)r='fwd2';
  showToast(T('gift')+' '+T('rw_'+r));
  await sleep(900);if(id!==G.id)return;
  if(r==='enter'){
    const j=G.S.steps[p].indexOf(-1);
    G.S.steps[p][j]=0;sfx('enter');place(p,j);await sleep(280);if(id!==G.id)return;
    if(checkCapture(p,j)){await sleep(350);if(id!==G.id)return;}
  }else{
    const d={fwd5:5,back5:-5,fwd3:3,back3:-3,fwd2:2}[r];
    await shiftPiece(p,i,d,id);if(id!==G.id)return;
    if(checkCapture(p,i)){await sleep(350);if(id!==G.id)return;}
  }
}

/* ---------- انیمیشن برنده ---------- */
function hexToRgb(hx){
  let s=hx.trim().replace('#','');
  if(s.length===3)s=s.split('').map(c=>c+c).join('');
  const n=parseInt(s,16);
  return[(n>>16)&255,(n>>8)&255,n&255];
}
function playWinFx(p,done){
  const cv=$('#winFx'),ctx=cv.getContext('2d');
  const dpr=GFX==='high'?Math.min(2,window.devicePixelRatio||1):1;
  const W=window.innerWidth,H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const raw=getComputedStyle(document.documentElement).getPropertyValue('--c'+p).trim();
  const col=hexToRgb(/^#[0-9a-f]{3,6}$/i.test(raw)?raw:'#ffe600');
  const rgb=col.join(',');
  const R=Math.min(W,H)*0.26,cx=W/2;
  const NP=GFX==='high'?700:GFX==='medium'?420:250,P=[];
  for(let i=0;i<NP;i++){
    const y=1-2*(i+.5)/NP,r=Math.sqrt(1-y*y),th=i*2.39996323;
    P.push({x:Math.cos(th)*r,y,z:Math.sin(th)*r,px:0,py:0,vx:0,vy:0});
  }
  const label=LANG==='en'?colorName(p).toUpperCase()+' WINS':colorName(p)+' برنده شد';
  const cy0=H+R,cyEnd=H*0.46;
  const T_SHATTER=2400,T_TEXT=2950,T_END=4300;
  const easeOutBack=t=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
  const t0=performance.now();
  let shattered=false,shatterAt=0,cy=cy0;
  cv.classList.remove('out');cv.hidden=false;
  function frame(now){
    const t=now-t0;
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    cy=t<1200?cy0+(cyEnd-cy0)*easeOutBack(t/1200):cyEnd;
    const ang=t*0.0022+(t>1200?(t-1200)*0.002:0),tilt=0.35;
    const ca=Math.cos(ang),sa=Math.sin(ang),ct=Math.cos(tilt),st=Math.sin(tilt);
    if(!shattered&&t>=T_SHATTER){
      shattered=true;shatterAt=t;sfx('capture');
      P.forEach(q=>{
        const d=Math.hypot(q.dx||0,q.dy||0)||1;
        const sp=180+Math.random()*420;
        q.vx=((q.dx||0)/d)*sp+(Math.random()-.5)*120;
        q.vy=((q.dy||0)/d)*sp-200;
      });
    }
    if(!shattered){
      const g=ctx.createRadialGradient(cx,cy,R*0.9,cx,cy,R*1.14);
      g.addColorStop(0,`rgba(${rgb},0)`);g.addColorStop(.55,`rgba(${rgb},.6)`);g.addColorStop(1,`rgba(${rgb},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.14,0,Math.PI*2);ctx.fill();
      P.forEach(q=>{
        const x1=q.x*ca+q.z*sa,z1=-q.x*sa+q.z*ca;
        const y1=q.y*ct-z1*st,z2=q.y*st+z1*ct;
        q.px=cx+x1*R;q.py=cy+y1*R;q.dx=x1;q.dy=y1;
        const k=(z2+1)/2,sz=1.2+1.4*k;
        ctx.fillStyle=`rgba(${rgb},${(.25+.75*k).toFixed(3)})`;
        ctx.fillRect(q.px,q.py,sz,sz);
      });
    }else{
      const dt=(t-shatterAt)/1000,a=Math.max(0,1-dt/1.4);
      ctx.fillStyle=`rgba(${rgb},${a.toFixed(3)})`;
      P.forEach(q=>{
        const x=q.px+q.vx*dt,y=q.py+q.vy*dt+0.5*900*dt*dt;
        ctx.fillRect(x,y,2.4,2.4);
      });
    }
    if(t>=T_TEXT){
      const k=Math.min(1,(t-T_TEXT)/500);
      ctx.save();
      ctx.globalAlpha=k;
      ctx.translate(cx,H*0.5);
      ctx.scale(1.3-0.3*k,1.3-0.3*k);
      ctx.font=`900 ${Math.round(Math.min(64,W/8))}px Vazirmatn,system-ui,sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor=`rgb(${rgb})`;ctx.shadowBlur=30;
      ctx.fillStyle=`rgb(${rgb})`;
      ctx.fillText(label,0,0);
      ctx.restore();
    }
    if(t<T_END)requestAnimationFrame(frame);
    else{done();cv.hidden=true;}
  }
  requestAnimationFrame(frame);
}

function win(p){
  G.phase='over';clearHints();setTurnUI();clearSave();recordWin(p);
  document.body.dataset.winner=p;
  setStatus('');
  $('#winTitle').textContent=T('winTitle',colorName(p));
  sfx('win');
  playWinFx(p,()=>{buildConfetti();showWinStats(p);showOverlay('win');});
}
function buildConfetti(){
  const box=$('#confetti');box.innerHTML='';
  const cols=['#e2574c','#3f78d8','#f2b632','#2fa36b','#ffffff'];
  const CN=GFX==='low'?24:GFX==='medium'?50:90;
  for(let k=0;k<CN;k++){
    const s=el('i','cf');
    s.style.left=rnd(100)+'%';
    s.style.background=cols[rnd(cols.length)];
    s.style.animationDelay=(rnd(300)/100)+'s';
    s.style.animationDuration=(2.4+rnd(200)/100)+'s';
    box.appendChild(s);
  }
}
function clearConfetti(){$('#confetti').innerHTML='';}
function showWinStats(p){
  $('#winCard').style.setProperty('--wc','var(--c'+p+')');
  $('#statMoves').textContent=num(G.moves);
  const s=Math.floor(elapsedMs()/1000);
  $('#statTime').textContent=num(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'));
}
// انیمیشن ورود عناصر
function introAnim(){
  const items=[];
  document.querySelectorAll('header .ib').forEach((e,k)=>items.push([e,k*90]));
  document.querySelectorAll('.zone').forEach((e,k)=>items.push([e,150+k*70]));
  document.querySelectorAll('.piece').forEach((e,k)=>items.push([e,300+k*40]));
  items.push([$('#dieBtn'),520]);
  document.querySelectorAll('#menuCard>*').forEach((e,k)=>items.push([e,260+k*80]));
  items.forEach(([e,d])=>{
    if(!e||e.hidden)return;
    e.animate([
      {opacity:0,transform:'translateY(24px) scale(.6)'},
      {opacity:1,transform:'translateY(0) scale(1)'}
    ],{duration:700,delay:d,easing:'cubic-bezier(.2,1.1,.4,1)',fill:'backwards'});
  });
}
function runLoader(){
  const ld=$('#loader');
  setTimeout(()=>{
    ld.classList.add('rise');
    setTimeout(introAnim,1150);
    setTimeout(()=>{ld.classList.add('done');setTimeout(()=>{ld.hidden=true;},700);},1500);
  },1900);
}

/* ---------- منو، تنظیمات و پنجره‌ها ---------- */
function isNative(){
  try{
    const C=window.Capacitor;
    return !!(C&&((C.isNativePlatform&&C.isNativePlatform())||(C.getPlatform&&C.getPlatform()!=='web')));
  }catch(e){return false;}
}
function capApp(){
  try{
    const C=window.Capacitor;if(!C)return null;
    if(C.Plugins&&C.Plugins.App)return C.Plugins.App;
    if(C.registerPlugin)return C.registerPlugin('App');
  }catch(e){}
  return null;
}
async function doExit(){
  try{const a=capApp();if(a){await a.exitApp();return;}}catch(e){}
  try{window.close();}catch(e){}
  setTimeout(()=>showOverlay('bye'),250);
}
function renderSeats(){
  const box=$('#seats');box.innerHTML='';
  cfg.forEach((m,p)=>{
    const b=el('button','seat'+(m==='off'?' off':''));
    b.innerHTML='<i class="dot" style="--pc:var(--c'+p+');--tint:var(--t'+p+')"></i><b>'+colorName(p)+'</b><span>'+T('mode_'+m)+'</span>';
    b.addEventListener('click',()=>{
      let n=MODES[(MODES.indexOf(cfg[p])+1)%3];
      if(n==='off'&&cfg.filter(x=>x!=='off').length<=2)n='human';
      cfg[p]=n;saveCfg();renderSeats();
    });
    box.appendChild(b);
  });
  $('#startBtn').disabled=cfg.filter(x=>x!=='off').length<2;
}
function markOpt(id,v){$(id).querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
function renderSkins(){
  const box=$('#optSkin');box.innerHTML='';
  const cur=curSkin();
  Object.keys(SKINS).forEach(k=>{
    const b=el('button',k===cur?'on':'');
    b.innerHTML='<span class="ico">'+ICONS[k]+'</span>'+SKINS[k].map(c=>'<i class="sw" style="background:'+c+'"></i>').join('')+T('skin_'+k);
    b.addEventListener('click',()=>{
      document.documentElement.setAttribute('data-skin',k);
      flashLight();renderPieceArt();renderDecor();renderHomeIco();refreshMusic();
      try{localStorage.setItem('mench.skin',k);}catch(e){}
      renderSkins();
    });
    box.appendChild(b);
  });
}
function renderSettings(){
  markOpt('#optLang',LANG);
  markOpt('#optTheme',document.documentElement.getAttribute('data-theme'));
  markOpt('#optSafe',SAFE?'on':'off');
  markOpt('#optAmb',AMB_ON?'on':'off');
  markOpt('#optFx',FX_ON?'on':'off');
  markOpt('#optGfx',GFX);
  markOpt('#optFps',FPS.show?'on':'off');
  markOpt('#optLevel',LEVEL);
  $('#devInfo').textContent=T('dev_'+DEVICE.tier)+' · '+T(GFX_KEY[GFX]);
  renderSkins();renderSeats();
}
const running=()=>!!G.S&&G.phase!=='over'&&G.phase!=='idle';
function showOverlay(kind){
  curKind=kind;
  $('#menuCard').hidden=kind!=='menu';
  $('#settingsCard').hidden=kind!=='settings';
  $('#winCard').hidden=kind!=='win';
  $('#exitCard').hidden=kind!=='exit';
  $('#byeCard').hidden=kind!=='bye';
  $('#statsCard').hidden=kind!=='stats';
  if(kind==='menu'){
    $('#resumeBtn').hidden=!running();
    const sv=!running()&&hasSave();
    $('#startBtn').textContent=T(running()?'newGame':sv?'continue':'start');
    $('#newBtn').hidden=!sv;
    $('#exitBtn').hidden=false;
    $('#startBtn').disabled=cfg.filter(x=>x!=='off').length<2;
  }
  if(kind==='settings')renderSettings();
  if(kind!=='win')clearConfetti();
  $('#overlay').classList.toggle('solid',kind==='win');
  $('#overlay').classList.add('show');
  refreshMusic();
}
function hideOverlay(){curKind=null;$('#overlay').classList.remove('show');refreshMusic();}
function askExit(){
  if(curKind==='exit')return;
  exitFrom=curKind;
  if(curKind===null&&G.phase!=='over')G.paused=true;
  showOverlay('exit');
}
function cancelExit(){
  if(exitFrom==='menu'||exitFrom==='win'||exitFrom==='settings')showOverlay(exitFrom);
  else{G.paused=false;hideOverlay();}
}
function onBack(){
  if(curKind==='bye')showOverlay('menu');
  else if(curKind==='exit')cancelExit();
  else if(curKind==='settings'||curKind==='stats')showOverlay('menu');
  else if(curKind==='menu'&&running()){G.paused=false;hideOverlay();}
  else askExit();
}
function bindOpt(id,fn){$(id).querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>fn(b.dataset.v)));}
bindOpt('#optLang',v=>{
  LANG=v;try{localStorage.setItem('mench.lang',v);}catch(e){}
  translate();setTurnUI();
  if(!$('#winCard').hidden)$('#winTitle').textContent=T('winTitle',colorName(+document.body.dataset.winner||0));
  if(curKind==='menu')showOverlay('menu');
  renderSettings();
});
bindOpt('#optTheme',v=>{applyTheme(v);flashLight();try{localStorage.setItem('mench.theme',v);}catch(e){}renderSettings();});
bindOpt('#optSafe',v=>{SAFE=v==='on';saveSafe();renderSettings();});
bindOpt('#optAmb',v=>{AMB_ON=v==='on';saveFlag('mench.amb',AMB_ON);refreshMusic();renderSettings();});
bindOpt('#optFx',v=>{FX_ON=v==='on';saveFlag('mench.fx',FX_ON);renderSettings();});
bindOpt('#optGfx',v=>{setGfx(v);renderSettings();});
bindOpt('#optFps',v=>{FPS.show=v==='on';try{localStorage.setItem('mench.fps',FPS.show?'1':'0');}catch(e){}updateFpsPill();renderSettings();});

$('#startBtn').addEventListener('click',()=>{if(!running()&&hasSave())loadSave();else newGame();});
$('#newBtn').addEventListener('click',newGame);
$('#settingsBtn').addEventListener('click',()=>showOverlay('settings'));
$('#statsBtn').addEventListener('click',()=>{renderStats();showOverlay('stats');});
$('#statsBackBtn').addEventListener('click',()=>showOverlay('menu'));
bindOpt('#optLevel',v=>{LEVEL=v;saveLevel();renderSettings();});
$('#backBtn').addEventListener('click',()=>showOverlay('menu'));
$('#againBtn').addEventListener('click',newGame);
$('#toMenuBtn').addEventListener('click',()=>showOverlay('menu'));
$('#resumeBtn').addEventListener('click',()=>{G.paused=false;hideOverlay();});
$('#exitBtn').addEventListener('click',askExit);
$('#exitYes').addEventListener('click',doExit);
$('#exitNo').addEventListener('click',cancelExit);
$('#byeBackBtn').addEventListener('click',()=>showOverlay('menu'));
$('#menuBtn').addEventListener('click',()=>{
  if(G.phase!=='over')G.paused=true;
  showOverlay('menu');
});
$('#dieBtn').addEventListener('click',()=>{if(G.phase==='roll'&&!isBot(G.turn))roll();});
$('#board').addEventListener('click',e=>{
  const pc=e.target.closest('.piece');
  if(!pc||G.phase!=='move')return;
  const p=+pc.dataset.p,i=+pc.dataset.i;
  if(p!==G.turn)return;
  let m=G.movable.find(x=>x.i===i);
  if(!m&&G.S.steps[p][i]===-1){
    const b=G.movable.find(x=>G.S.steps[p][x.i]===-1);
    if(b)m={i,t:b.t};
  }
  if(m)doMove(m);else nope(pc);
});
window.addEventListener('resize',fit);
try{new ResizeObserver(fit).observe($('#stage'));}catch(e){}
try{const a=capApp();if(a&&isNative())a.addListener('backButton',onBack);}catch(e){}

/* ---------- راه‌اندازی ---------- */
applyGfxAttr();
makeMotes();audioInit();
FPS.show=localStorage.getItem('mench.fps')==='1';updateFpsPill();requestAnimationFrame(fpsLoop);
translate();
buildBoard();buildDie();fit();renderDecor();renderHomeIco();
showOverlay('menu');
runLoader();
})();
</script>
